    <h1 align="center"><ruby>孔融让梨<rt>kǒng róng ràng lí</rt></ruby></h1>
    <h3 align="center">中国古代道德教育故事之一——《三字经》中“融四岁,能让梨”</h3>
    <hr color="#FF3333">
    <p>
        孔融，字文举，东汉时期中国山东曲阜人，是孔子的第二十世孙，是中国古代东汉末文学家。
    </p>
    <p>
        孔融四岁的时候，和哥哥吃梨，总是拿小的吃。有人问他为什么这么做。他回答说：“小孩子食量小，按道理应该拿小的。”
    </p>
    <blockquote>
        <img src="pro21/image-2-1-1.jpg" alt="孔融让梨">
    </blockquote>
    <blockquote>
        <font face="黑体" color="#FE2233" size="5">中国千百年来流传的一个道德教育故事，这个故事告诉人们，凡事应该遵守公序良俗。</font>
    </blockquote>
    <hr color="red" size="3">
    <p align="center">
        <strong>这些都是年幼时就应该知道的<u>道德常识。</u></strong> 这是中国古代东汉末年官员、名士、<em>文学家&nbsp;<font size="+3">孔融©&nbsp;</font></em>的真实故事。
    </p>
